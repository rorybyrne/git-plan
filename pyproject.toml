[project]
name = "git-plan"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=5.5.0",
    "dependency-injector>=4.44.0",
    "humanize>=4.11.0",
    "inquirer>=3.4.0",
    "rich>=13.9.4",
]

[tool.uv]
dev-dependencies = [
    "coverage>=7.6.9",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "pylint>=3.3.2",
    "pytest>=8.3.4",
    "tox>=4.23.2",
]
package = true

[project.scripts]
git-plan = 'git_plan.__cli__:main'
gp = 'git_plan.__cli__:main'

[tool.pylint.MASTER]
extension-pkg-whitelist = "dependency_injector"
generated-members = "dependency_inector.*, subcommand, wire"
good-names = "id, fp, e"
max-line-length = 120

[tool.isort]
known_first_party = ['git_plan']

[tool.ruff]
line-length = 120
